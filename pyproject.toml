[project]
name = "cyc-survey-platform"
version = "0.1.0"
description = "CYC Survey Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "supabase>=2.30.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "pydantic>=2.13.4",
    "pdfplumber>=0.11.8",
    "json-repair>=0.59.10",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["api"]
