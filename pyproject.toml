[project]
name = "cyc-survey-platform"
version = "0.1.0"
description = "CYC Survey Platform"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "httpx",
    "numpy",
    "pdfplumber",
    "python-dotenv",
    "python-multipart",
    "pydantic",
    "scikit-learn",
    "supabase",
    "uvicorn",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["api"]
